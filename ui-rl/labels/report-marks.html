<title>报告页框选标注</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 和 critique.html 同一套色:灰底白面板;问题用橙色框,好的地方用绿色框。左边整页截图,右边这页的标记清单 */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2129; --dim: #5f6673; --line: #dfe2e8;
    --accent: #c2410c; --accent-soft: #fbe9df; --ok: #2f7d4f; --ok-soft: #e3f1e8; --chip: #eef0f4;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
      --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --ok-soft: #1c3226; --chip: #2a2e35; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
    --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --ok-soft: #1c3226; --chip: #2a2e35; color-scheme: dark;
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; min-width: 100px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .warn { color: var(--accent); font-size: 13px; }
  button {
    font: inherit; color: var(--fg); background: var(--chip); border: 1px solid transparent;
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--line); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--panel); }
  button:disabled { opacity: .45; cursor: default; }
  kbd { font: 11px var(--mono); color: var(--dim); margin-left: 4px; }
  button.primary kbd { color: inherit; opacity: .8; }

  .wrap {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start;
    padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .frame { position: relative; background: var(--panel); border: 1px solid var(--line); max-width: 1440px; }
  .frame img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .ov { position: absolute; inset: 0; cursor: crosshair; }
  .box { position: absolute; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 2px; }
  .box.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .box.draft { border-style: dashed; }
  .box.hot { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .box.good.hot { background: color-mix(in srgb, var(--ok) 22%, transparent); }
  .box b {
    position: absolute; left: -2px; top: -22px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
    background: var(--accent); color: var(--panel); font: 600 12px/20px var(--mono); text-align: center; border-radius: 3px 3px 3px 0;
  }
  .box.good b { background: var(--ok); }

  aside {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 76px); overflow: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 12px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .help { color: var(--dim); font-size: 13px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .timer { font: 13px var(--mono); color: var(--dim); }
  ol.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.items li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 4px 8px; align-items: start; }
  ol.items li .n { background: var(--accent); color: var(--panel); font: 600 12px/20px var(--mono); text-align: center; border-radius: 3px; height: 20px; }
  ol.items li.good .n { background: var(--ok); }
  ol.items li .kind { display: flex; gap: 4px; align-items: center; }
  ol.items li .kind .del { margin-left: auto; color: var(--dim); }
  ol.items li .say { grid-column: 2; }
  .seg button { padding: 2px 10px; font-size: 13px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .seg button.on.okb { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  textarea, input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical;
  }
  .lab { font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions .primary { flex: 1; }
  .saved { font-size: 13px; color: var(--ok); min-height: 1.5em; }
  .note { padding: 24px 0; color: var(--dim); }
  .touch { display: none; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); padding-bottom: 46vh; }
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 4; max-height: 44vh; border-radius: 12px 12px 0 0; border-width: 1px 0 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .touch { display: inline-block; }
    .ov.scroll { pointer-events: none; }
    kbd { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { .box { transition: background .12s; } }
</style>

<header>
  <h1>报告页框选标注</h1>
  <span class="meta" id="pos">—</span>
  <div class="bar"><i id="prog"></i></div>
  <span class="meta" id="done">—</span>
  <span class="warn" id="store"></span>
</header>

<div class="wrap">
  <div class="frame" id="frame"><img id="img" alt="报告页面整页截图"><div class="ov" id="ov"></div></div>

  <aside>
    <div class="row">
      <p class="help">同一份数据做出的 6 版排在一起。在截图上拖框圈出做得好或有问题的地方，选「好」或「问题」，写一句为什么。</p>
      <button class="touch" id="drawToggle">现在：滚动</button>
    </div>
    <ol class="items" id="items"></ol>
    <div class="empty" id="noItems">还没有圈。在截图上拖一个框。</div>
    <div class="lab">整页（可选）
      <div class="seg" id="rating">
        <button data-v="good" class="okb">好</button>
        <button data-v="ok">一般</button>
        <button data-v="bad">差</button>
      </div>
    </div>
    <label class="lab" for="note">整页意见（可选）<textarea id="note" rows="2" placeholder="比如「结论应该放在最前面」"></textarea></label>
    <div class="row"><span class="timer" id="timer">用时 0:00</span><span class="saved" id="saved"></span></div>
    <div class="actions">
      <button class="primary" id="save">保存，下一页<kbd>⌘↵</kbd></button>
    </div>
    <div class="actions">
      <button id="prev">上一页<kbd>←</kbd></button>
      <button id="next">下一页<kbd>→</kbd></button>
      <button id="skip">下一个没标的</button>
    </div>
  </aside>
</div>

<script>
(async () => {
  // 每页存一份 marks/<页面>:框(截图像素坐标)、每个框是好还是问题和一句话、整页好坏、整页意见、用时。
  // 存在 artifact 的 db 里,Claude 读得到;db 不可用时存浏览器本地。
  const $ = (id) => document.getElementById(id);
  let pages = [];
  try { pages = await (await fetch('report-marks.json')).json(); }
  catch { $('frame').outerHTML = '<p class="note">读不到 report-marks.json，页面没有加载。</p>'; return; }

  let idx = 0;
  const marks = {};                    // 已保存的 db 文档
  const drafts = {};                   // 还没保存的改动(切页不丢)

  // ---------- 存储 ----------
  let db = null;
  const LS = 'report-marks';
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(marks)); } catch {} };
  const useLocal = () => {
    try { Object.assign(marks, JSON.parse(localStorage.getItem(LS) || '{}')); } catch {}
    $('store').textContent = '标注只存在这个浏览器里，标完请告诉 Claude 换个方式导出';
    render();
  };
  (window.claude?.use ? window.claude.use('db') : Promise.resolve(null)).then((d) => {
    if (!d) return useLocal();
    db = d;
    db.collection('marks').onSnapshot((s) => { for (const doc of s.docs) marks[doc.id] = doc.data(); render(); }, useLocal);
  }).catch(useLocal);
  async function put(id, doc) {
    $('saved').textContent = '保存中…';
    try { if (db) await db.collection('marks').doc(id).set(doc); else saveLocal(); $('saved').textContent = '已保存'; }
    catch { saveLocal(); $('saved').textContent = '存到本地了'; }
  }

  // ---------- 用时:只在页面可见时计 ----------
  let tick = 0, base = 0;
  setInterval(() => { if (document.visibilityState === 'visible') { tick++; showTime(); } }, 1000);
  const showTime = () => { const s = base + tick; $('timer').textContent = `用时 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const startClock = (prev) => { base = prev || 0; tick = 0; showTime(); };

  // ---------- 框 ----------
  const cur = () => pages[idx];
  const draftOf = (p) => (drafts[p.id] ??= structuredClone(marks[p.id] ?? { items: [], rating: null, note: '' }));
  const pct = (p, b) => `left:${b.x / p.w * 100}%;top:${b.y / p.h * 100}%;width:${b.w / p.w * 100}%;height:${b.h / p.h * 100}%`;
  function drawBoxes(p, items, temp) {
    $('ov').innerHTML = items.map((it, i) => `<div class="box${it.kind === 'good' ? ' good' : ''}" data-i="${i}" style="${pct(p, it)}"><b>${i + 1}</b></div>`).join('')
      + (temp ? `<div class="box draft" style="${pct(p, temp)}"></div>` : '');
  }

  function render() {
    const p = cur(); if (!p) return;
    if ($('img').getAttribute('src') !== p.image) { $('img').src = p.image; window.scrollTo(0, 0); }
    const d = draftOf(p);
    drawBoxes(p, d.items);
    $('items').innerHTML = d.items.map((it, i) => `<li data-i="${i}" class="${it.kind === 'good' ? 'good' : ''}">
      <span class="n">${i + 1}</span>
      <span class="kind seg"><button data-k="bad" data-i="${i}" class="${it.kind === 'bad' ? 'on' : ''}">问题</button><button data-k="good" data-i="${i}" class="okb${it.kind === 'good' ? ' on' : ''}">好</button>
        <button class="del" data-i="${i}" aria-label="删掉第 ${i + 1} 处">删</button></span>
      <span class="say"><input type="text" id="c-${p.id}-${i}" data-i="${i}" value="${escapeAttr(it.comment)}" placeholder="${it.kind === 'good' ? '好在哪' : '问题在哪、该怎么做'}"></span></li>`).join('');
    $('noItems').hidden = d.items.length > 0;
    document.querySelectorAll('#rating button').forEach((b) => b.classList.toggle('on', d.rating === b.dataset.v));
    if (document.activeElement !== $('note')) $('note').value = d.note ?? '';
    const inSet = pages.filter((q) => q.set === p.set), n = pages.filter((q) => marks[q.id]).length;
    $('pos').textContent = `第 ${idx + 1} / ${pages.length} 页 · 数据 ${p.set} 的第 ${inSet.indexOf(p) + 1} / ${inSet.length} 版`;
    $('done').textContent = `已标 ${n}`;
    $('prog').style.width = (n / pages.length * 100) + '%';
    const q = pages[idx + 1]; if (q) new Image().src = q.image;
  }

  // 拖框
  let drag = null;
  const toImg = (e) => {
    const r = $('img').getBoundingClientRect(), p = cur(), k = p.w / r.width;
    return { x: Math.max(0, Math.min(p.w, (e.clientX - r.left) * k)), y: Math.max(0, Math.min(p.h, (e.clientY - r.top) * k)) };
  };
  $('ov').addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); $('ov').setPointerCapture(e.pointerId);
    drag = { a: toImg(e) };
  });
  $('ov').addEventListener('pointermove', (e) => {
    if (!drag) return;
    const b = toImg(e), a = drag.a;
    drag.r = { x: Math.round(Math.min(a.x, b.x)), y: Math.round(Math.min(a.y, b.y)), w: Math.round(Math.abs(b.x - a.x)), h: Math.round(Math.abs(b.y - a.y)) };
    if (drag.r.w > 6 || drag.r.h > 6) drawBoxes(cur(), draftOf(cur()).items, drag.r);
  });
  $('ov').addEventListener('pointerup', () => {
    if (!drag) return;
    const { r } = drag; drag = null;
    const p = cur(), d = draftOf(p);
    if (!r || r.w < 8 || r.h < 8) return drawBoxes(p, d.items);
    d.items.push({ ...r, kind: 'bad', comment: '' });
    render();
    $(`c-${p.id}-${d.items.length - 1}`)?.focus();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drag) { drag = null; drawBoxes(cur(), draftOf(cur()).items); } });

  $('items').addEventListener('input', (e) => { const i = e.target.dataset.i; if (i != null) draftOf(cur()).items[i].comment = e.target.value; });
  $('items').addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = draftOf(cur()), i = +t.dataset.i;
    if (t.classList.contains('del')) d.items.splice(i, 1);
    else if (t.dataset.k) d.items[i].kind = t.dataset.k;
    render(); hot(t.classList.contains('del') ? null : i);
  });
  $('items').addEventListener('focusin', (e) => hot(e.target.dataset.i));
  $('items').addEventListener('focusout', () => hot(null));
  $('items').addEventListener('mouseover', (e) => hot(e.target.closest('li')?.dataset.i));
  $('items').addEventListener('mouseleave', () => hot(null));
  const hot = (i) => document.querySelectorAll('#ov .box').forEach((b) => b.classList.toggle('hot', b.dataset.i === String(i)));
  $('rating').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; const d = draftOf(cur()); d.rating = d.rating === b.dataset.v ? null : b.dataset.v; render(); });
  $('note').addEventListener('input', () => { draftOf(cur()).note = $('note').value; });

  async function save() {
    const p = cur(), d = draftOf(p);
    const items = d.items.filter((it) => it.comment.trim()).map(({ x, y, w, h, kind, comment }) => ({ x, y, w, h, kind, comment: comment.trim() }));
    if (!items.length && !d.note.trim() && !d.rating) { $('saved').textContent = '先圈一处并写一句，或者给整页一个评价'; return; }
    if (items.length < d.items.length) { $('saved').textContent = '有框还没写字：写一句，或者删掉它'; return; }
    const doc = { page: p.id, set: p.set, items, rating: d.rating, note: d.note.trim(), seconds: base + tick, at: new Date().toISOString() };
    marks[p.id] = doc; delete drafts[p.id];
    await put(p.id, doc);
    setTimeout(() => go(1), 250);
  }
  function go(k) { idx = Math.max(0, Math.min(pages.length - 1, idx + k)); $('saved').textContent = ''; startClock(marks[cur().id]?.seconds); render(); }
  $('save').onclick = save;
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('skip').onclick = () => { const i = pages.findIndex((q) => !marks[q.id]); if (i >= 0) { idx = i; go(0); } };
  $('drawToggle').onclick = () => { const on = $('ov').classList.toggle('scroll'); $('drawToggle').textContent = on ? '现在：滚动' : '现在：画框'; $('ov').style.touchAction = on ? '' : 'none'; };
  $('ov').classList.add('scroll'); // 手机上默认能滚动,点按钮切到画框;桌面上这个类不起作用
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); return; }
    if (e.target.matches('input, textarea')) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); return; }
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  function escapeAttr(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  go(0);
})();
</script>
