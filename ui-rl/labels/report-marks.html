<title>报告页框选标注</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 和 critique.html 同一套色:灰底白面板;问题用橙色框,好的地方用绿色框。左边两版截图并排,右边选哪版好和圈出的理由 */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2129; --dim: #5f6673; --line: #dfe2e8;
    --accent: #c2410c; --accent-soft: #fbe9df; --ok: #2f7d4f; --ok-soft: #e3f1e8; --chip: #eef0f4;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
      --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --ok-soft: #1c3226; --chip: #2a2e35; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
    --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --ok-soft: #1c3226; --chip: #2a2e35; color-scheme: dark;
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; min-width: 100px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .warn { color: var(--accent); font-size: 13px; }
  button {
    font: inherit; color: var(--fg); background: var(--chip); border: 1px solid transparent;
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--line); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--panel); }
  kbd { font: 11px var(--mono); color: var(--dim); margin-left: 4px; }
  button.primary kbd { color: inherit; opacity: .8; }

  .wrap {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start;
    padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; min-width: 0; }
  .stage.one { grid-template-columns: minmax(0, 1fr); }
  .shot { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .shot .tag { font-size: 13px; font-weight: 600; color: var(--dim); }
  .frame { position: relative; background: var(--panel); border: 1px solid var(--line); }
  .frame img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .ov { position: absolute; inset: 0; cursor: crosshair; }
  .box { position: absolute; border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 2px; }
  .box.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .box.draft { border-style: dashed; }
  .box.hot { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .box.good.hot { background: color-mix(in srgb, var(--ok) 22%, transparent); }
  .box b {
    position: absolute; left: -2px; top: -22px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
    background: var(--accent); color: var(--panel); font: 600 12px/20px var(--mono); text-align: center; border-radius: 3px 3px 3px 0;
  }
  .box.good b { background: var(--ok); }

  aside {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 76px); overflow: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 12px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  .help { color: var(--dim); font-size: 13px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .timer { font: 13px var(--mono); color: var(--dim); }
  .lab { font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 2px 10px; font-size: 13px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .seg button.on.okb { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  #choice button { flex: 1; min-width: 56px; padding: 5px 4px; }
  ol.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.items li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 4px 8px; align-items: start; }
  ol.items li .n { background: var(--accent); color: var(--panel); font: 600 12px/20px var(--mono); text-align: center; border-radius: 3px; height: 20px; }
  ol.items li.good .n { background: var(--ok); }
  ol.items li .kind { display: flex; gap: 4px; align-items: center; }
  ol.items li .kind .side { font-size: 12px; color: var(--dim); margin-right: 4px; }
  ol.items li .kind .del { margin-left: auto; color: var(--dim); }
  ol.items li .say { grid-column: 2; }
  textarea, input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical;
  }
  .empty { color: var(--dim); font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions .primary { flex: 1; }
  .saved { font-size: 13px; color: var(--ok); min-height: 1.5em; }
  .note { padding: 24px 0; color: var(--dim); }
  .touch { display: none; }
  .filebtn { font-size: 14px; color: var(--fg); background: var(--chip); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: minmax(0, 1fr); padding-bottom: 46vh; }
    aside {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 4; max-height: 44vh; border-radius: 12px 12px 0 0; border-width: 1px 0 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .touch { display: inline-block; }
    .ov.scroll { pointer-events: none; }
    kbd { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { .box { transition: background .12s; } }
</style>

<header>
  <h1>报告页框选标注</h1>
  <span class="meta" id="pos">—</span>
  <div class="bar"><i id="prog"></i></div>
  <span class="meta" id="done">—</span>
  <span class="warn" id="store"></span>
</header>

<div class="wrap">
  <div class="stage" id="stage">
    <section class="shot" id="shotL"><span class="tag">左</span><div class="frame"><img id="imgL" alt="左边那版的整页截图"><div class="ov" id="ovL" data-side="left"></div></div></section>
    <section class="shot" id="shotR"><span class="tag">右</span><div class="frame"><img id="imgR" alt="右边那版的整页截图"><div class="ov" id="ovR" data-side="right"></div></div></section>
  </div>

  <aside>
    <p class="help">同一份数据做出的两版。先选哪版好；再只圈让你这样选的那几处（两边都可以圈），选「好」或「问题」，各写一句为什么。很像就选「差不多」。</p>
    <div class="lab">哪版好
      <div class="seg" id="choice">
        <button data-v="left2">左明显好</button><button data-v="left1">左稍好</button><button data-v="tie">差不多</button><button data-v="right1">右稍好</button><button data-v="right2">右明显好</button>
      </div>
    </div>
    <div class="row">
      <div class="seg" id="view" aria-label="怎么看">
        <button data-v="both" class="on">并排</button><button data-v="left">只看左</button><button data-v="right">只看右</button>
      </div>
      <button class="touch" id="drawToggle">现在：滚动</button>
    </div>
    <ol class="items" id="items"></ol>
    <div class="empty" id="noItems">还没有圈。在截图上拖一个框。</div>
    <label class="lab" for="note">补充（可选）<textarea id="note" rows="2" placeholder="比如「两版都把结论放最后，差别只在图表」"></textarea></label>
    <div class="row"><span class="timer" id="timer">用时 0:00</span><span class="saved" id="saved"></span></div>
    <div class="actions">
      <button class="primary" id="save">保存，下一对<kbd>⌘↵</kbd></button>
    </div>
    <div class="actions">
      <button id="prev">上一对<kbd>←</kbd></button>
      <button id="next">下一对<kbd>→</kbd></button>
      <button id="skip">下一个没标的</button>
    </div>
    <div class="actions" id="offline" hidden>
      <button id="export">导出标注</button>
      <label class="filebtn" for="import">导入标注<input type="file" id="import" accept=".json,application/json" hidden></label>
    </div>
  </aside>
</div>

<script>
(async () => {
  // 每对存一份 marks/<对>:选哪版好(left2/left1/tie/right1/right2)、圈的框(side、截图像素坐标、好还是问题、一句话)、补充、用时。
  // 存在 artifact 的 db 里,Claude 读得到;db 不可用时存浏览器本地。
  // 离线版(scripts/report-marks-offline.py 打包):清单和截图在 window.REPORT_MARKS 里,之前的标注在 window.REPORT_MARKS_SEED 里,
  // 标注存浏览器本地,用「导出标注」存成 JSON 文件发给 Claude。
  const $ = (id) => document.getElementById(id);
  let pages = {}, pairs = [];
  try { const j = window.REPORT_MARKS ?? await (await fetch('report-marks.json')).json(); pairs = j.pairs; for (const p of j.pages) pages[p.id] = p; }
  catch { $('stage').outerHTML = '<p class="note">读不到 report-marks.json，页面没有加载。</p>'; return; }

  let idx = 0;
  const marks = {};                    // 已保存的 db 文档
  const drafts = {};                   // 还没保存的改动(切页不丢)

  // ---------- 存储 ----------
  let db = null;
  const LS = 'report-marks';
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(marks)); } catch {} };
  const useLocal = () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch {}
    Object.assign(marks, saved ?? window.REPORT_MARKS_SEED ?? {});
    if (!saved && window.REPORT_MARKS_SEED) saveLocal();
    // 离线打开时没有 window.claude,能导出文件;在 artifact 里 db 不可用时下载被拦,只能提示
    const offline = !window.claude;
    $('store').textContent = offline ? '标注存在这个浏览器里，标完点「导出标注」把文件发给 Claude' : '标注只存在这个浏览器里，标完请告诉 Claude 换个方式导出';
    $('offline').hidden = !offline;
    render();
  };
  (window.claude?.use ? window.claude.use('db') : Promise.resolve(null)).then((d) => {
    if (!d) return useLocal();
    db = d;
    db.collection('marks').onSnapshot((s) => { for (const doc of s.docs) marks[doc.id] = doc.data(); render(); }, useLocal);
  }).catch(useLocal);
  async function put(id, doc) {
    $('saved').textContent = '保存中…';
    try { if (db) await db.collection('marks').doc(id).set(doc); else saveLocal(); $('saved').textContent = '已保存'; }
    catch { saveLocal(); $('saved').textContent = '存到本地了'; }
  }

  // ---------- 用时:只在页面可见时计 ----------
  let tick = 0, base = 0;
  setInterval(() => { if (document.visibilityState === 'visible') { tick++; showTime(); } }, 1000);
  const showTime = () => { const s = base + tick; $('timer').textContent = `用时 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const startClock = (prev) => { base = prev || 0; tick = 0; showTime(); };

  // ---------- 框 ----------
  const cur = () => pairs[idx];
  const pageOf = (side) => pages[cur()[side]];
  const ovOf = (side) => $(side === 'left' ? 'ovL' : 'ovR');
  const imgOf = (side) => $(side === 'left' ? 'imgL' : 'imgR');
  // 看用 draftOf(没改过就是已保存的那份,db 晚到也能显示);要改时用 edit,才建一份草稿
  const draftOf = (q) => drafts[q.id] ?? marks[q.id] ?? { choice: null, items: [], note: '' };
  const edit = (q) => (drafts[q.id] ??= structuredClone(marks[q.id] ?? { choice: null, items: [], note: '' }));
  const pct = (p, b) => `left:${b.x / p.w * 100}%;top:${b.y / p.h * 100}%;width:${b.w / p.w * 100}%;height:${b.h / p.h * 100}%`;
  function drawBoxes(side, temp) {
    const p = pageOf(side), items = draftOf(cur()).items;
    ovOf(side).innerHTML = items.map((it, i) => it.side !== side ? '' : `<div class="box${it.kind === 'good' ? ' good' : ''}" data-i="${i}" style="${pct(p, it)}"><b>${i + 1}</b></div>`).join('')
      + (temp ? `<div class="box draft" style="${pct(p, temp)}"></div>` : '');
  }

  function render() {
    const q = cur(); if (!q) return;
    for (const side of ['left', 'right']) {
      const p = pageOf(side);
      if (imgOf(side).getAttribute('src') !== p.image) { imgOf(side).src = p.image; window.scrollTo(0, 0); }
      drawBoxes(side);
    }
    const d = draftOf(q);
    document.querySelectorAll('#choice button').forEach((b) => b.classList.toggle('on', d.choice === b.dataset.v));
    $('items').innerHTML = d.items.map((it, i) => `<li data-i="${i}" class="${it.kind === 'good' ? 'good' : ''}">
      <span class="n">${i + 1}</span>
      <span class="kind seg"><span class="side">${it.side === 'left' ? '左' : '右'}</span><button data-k="bad" data-i="${i}" class="${it.kind === 'bad' ? 'on' : ''}">问题</button><button data-k="good" data-i="${i}" class="okb${it.kind === 'good' ? ' on' : ''}">好</button>
        <button class="del" data-i="${i}" aria-label="删掉第 ${i + 1} 处">删</button></span>
      <span class="say"><input type="text" id="c-${q.id}-${i}" data-i="${i}" value="${escapeAttr(it.comment)}" placeholder="${it.kind === 'good' ? '好在哪' : '问题在哪'}"></span></li>`).join('');
    $('noItems').hidden = d.items.length > 0;
    if (document.activeElement !== $('note')) $('note').value = d.note ?? '';
    const inSet = pairs.filter((x) => x.set === q.set), n = pairs.filter((x) => marks[x.id]).length;
    $('pos').textContent = `第 ${idx + 1} / ${pairs.length} 对 · 数据 ${q.set}`;
    $('done').textContent = `已标 ${n}`;
    $('prog').style.width = (n / pairs.length * 100) + '%';
    const nx = pairs[idx + 1]; if (nx) { new Image().src = pages[nx.left].image; new Image().src = pages[nx.right].image; }
  }

  // 拖框:在哪边的截图上拖,框就记在哪边
  let drag = null;
  const toImg = (side, e) => {
    const r = imgOf(side).getBoundingClientRect(), p = pageOf(side), k = p.w / r.width;
    return { x: Math.max(0, Math.min(p.w, (e.clientX - r.left) * k)), y: Math.max(0, Math.min(p.h, (e.clientY - r.top) * k)) };
  };
  for (const ov of [$('ovL'), $('ovR')]) {
    const side = ov.dataset.side;
    ov.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault(); ov.setPointerCapture(e.pointerId);
      drag = { side, a: toImg(side, e) };
    });
    ov.addEventListener('pointermove', (e) => {
      if (!drag || drag.side !== side) return;
      const b = toImg(side, e), a = drag.a;
      drag.r = { x: Math.round(Math.min(a.x, b.x)), y: Math.round(Math.min(a.y, b.y)), w: Math.round(Math.abs(b.x - a.x)), h: Math.round(Math.abs(b.y - a.y)) };
      if (drag.r.w > 6 || drag.r.h > 6) drawBoxes(side, drag.r);
    });
    ov.addEventListener('pointerup', () => {
      if (!drag || drag.side !== side) return;
      const { r } = drag; drag = null;
      if (!r || r.w < 8 || r.h < 8) return drawBoxes(side);
      const d = edit(cur());
      d.items.push({ side, ...r, kind: 'bad', comment: '' });
      render();
      $(`c-${cur().id}-${d.items.length - 1}`)?.focus();
    });
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && drag) { const s = drag.side; drag = null; drawBoxes(s); } });

  $('items').addEventListener('input', (e) => { const i = e.target.dataset.i; if (i != null) edit(cur()).items[i].comment = e.target.value; });
  $('items').addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = edit(cur()), i = +t.dataset.i;
    if (t.classList.contains('del')) d.items.splice(i, 1);
    else if (t.dataset.k) d.items[i].kind = t.dataset.k;
    render(); hot(t.classList.contains('del') ? null : i);
  });
  $('items').addEventListener('focusin', (e) => hot(e.target.dataset.i));
  $('items').addEventListener('focusout', () => hot(null));
  $('items').addEventListener('mouseover', (e) => hot(e.target.closest('li')?.dataset.i));
  $('items').addEventListener('mouseleave', () => hot(null));
  const hot = (i) => document.querySelectorAll('.ov .box').forEach((b) => b.classList.toggle('hot', b.dataset.i === String(i)));
  $('choice').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { edit(cur()).choice = b.dataset.v; render(); } });
  $('note').addEventListener('input', () => { edit(cur()).note = $('note').value; });
  $('view').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.v;
    document.querySelectorAll('#view button').forEach((x) => x.classList.toggle('on', x === b));
    $('stage').classList.toggle('one', v !== 'both');
    $('shotL').hidden = v === 'right'; $('shotR').hidden = v === 'left';
  });

  async function save() {
    const q = cur(), d = draftOf(q);
    if (!d.choice) { $('saved').textContent = '先选哪版好'; return; }
    const items = d.items.filter((it) => it.comment.trim()).map(({ side, x, y, w, h, kind, comment }) => ({ side, x, y, w, h, kind, comment: comment.trim() }));
    if (items.length < d.items.length) { $('saved').textContent = '有框还没写字：写一句，或者删掉它'; return; }
    if (d.choice !== 'tie' && !items.length && !d.note.trim()) { $('saved').textContent = '圈一处让你这样选的地方，或者在补充里写一句'; return; }
    const doc = { pair: q.id, set: q.set, left: q.left, right: q.right, ...(q.repeat ? { repeat: q.repeat } : {}), choice: d.choice, items, note: d.note.trim(), seconds: base + tick, at: new Date().toISOString() };
    marks[q.id] = doc; delete drafts[q.id];
    await put(q.id, doc);
    setTimeout(() => go(1), 250);
  }
  function go(k) { idx = Math.max(0, Math.min(pairs.length - 1, idx + k)); $('saved').textContent = ''; startClock(marks[cur().id]?.seconds); render(); }
  $('save').onclick = save;
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('skip').onclick = () => { const i = pairs.findIndex((x) => !marks[x.id]); if (i >= 0) { idx = i; go(0); } };
  // 导出:把全部标注存成一个 JSON 文件;导入:读回导出的文件(换浏览器或清了本地数据时用)
  $('export').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(marks, null, 1)], { type: 'application/json' }));
    a.download = `report-marks-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('saved').textContent = `导出了 ${Object.keys(marks).length} 对`;
  };
  $('import').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { Object.assign(marks, JSON.parse(await f.text())); saveLocal(); $('saved').textContent = `导入了，共 ${Object.keys(marks).length} 对`; render(); }
    catch { $('saved').textContent = '这个文件读不了，要用「导出标注」存下的 JSON'; }
    e.target.value = '';
  };
  $('drawToggle').onclick = () => {
    const on = $('ovL').classList.toggle('scroll'); $('ovR').classList.toggle('scroll', on);
    $('drawToggle').textContent = on ? '现在：滚动' : '现在：画框';
    for (const ov of [$('ovL'), $('ovR')]) ov.style.touchAction = on ? '' : 'none';
  };
  $('ovL').classList.add('scroll'); $('ovR').classList.add('scroll'); // 手机上默认能滚动,点按钮切到画框;桌面上这个类不起作用
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); save(); return; }
    if (e.target.matches('input, textarea')) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); return; }
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  function escapeAttr(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  go(0);
})();
</script>
