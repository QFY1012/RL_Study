<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online consultation | Test group review</title><style>
:root{--ink:#183b40;--muted:#647777;--paper:#f4f4ed;--line:#d8dfd7;--teal:#087e79;--control:#9daeb3;--orange:#ba542d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5}main{max-width:1240px;margin:auto;padding:0 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:25px 0 19px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase}.brand{font-weight:bold;display:flex;align-items:center;gap:10px}.mark{background:var(--teal);color:white;width:25px;height:25px;display:grid;place-items:center;font-size:22px}.hero{display:grid;grid-template-columns:1.65fr 1fr;gap:80px;padding:48px 0 36px}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:bold;text-transform:uppercase;color:var(--teal);margin:0 0 15px}h1{font-family:Georgia,serif;font-size:54px;line-height:1.07;letter-spacing:-1.6px;font-weight:normal;margin:0 0 20px}h1 em{color:var(--teal);font-style:normal}.intro{font-size:17px;color:var(--muted);max-width:590px;margin:0}.scope{border-left:1px solid var(--line);padding-left:30px;align-self:center}.scope strong{font-size:40px;font-weight:normal;line-height:1.2}.scope p{margin:4px 0 20px;color:var(--muted)}.scope-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.metric{border:1px solid var(--line);background:#fff;padding:22px 24px;position:relative}.metric:first-child{border-top:3px solid var(--teal);padding-top:20px}.metric-label{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:bold}.metric-value{font-size:35px;letter-spacing:-1px;margin:10px 0 6px;white-space:nowrap}.metric-value b{font-weight:normal;color:var(--teal)}.metric-value .arrow{color:#99a8a6;font-size:24px;padding:0 8px}.metric small{color:var(--muted);font-size:12px}.metric.alert .metric-value b{color:var(--orange)}.metric p{margin:14px 0 0;font-size:13px;border-top:1px solid #edf0eb;padding-top:12px}.section{margin-top:43px}.section-title{display:flex;align-items:baseline;gap:14px;margin-bottom:19px}.section-title .num{font-size:12px;color:var(--teal);font-weight:bold}h2{font-family:Georgia,serif;font-size:28px;font-weight:normal;margin:0;line-height:1.2}.section-title .aside{margin-left:auto;font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);padding:26px}.speed-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--control)}.dot.test{background:var(--teal)}.chart-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:20px}.bar-row{display:grid;grid-template-columns:106px 1fr;gap:16px;align-items:center;margin:19px 0}.bar-label{font-size:12px}.bar-pair{display:grid;gap:7px}.bar-track{position:relative;height:22px;padding-right:45px}.bar{height:22px;background:var(--control);position:relative}.bar.test{background:var(--teal)}.bar span{position:absolute;left:calc(100% + 9px);font-size:12px;line-height:22px;white-space:nowrap}.axis{display:flex;justify-content:space-between;margin-left:122px;padding-right:45px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}.note{font-size:12px;color:var(--muted);margin:20px 0 0}.insight{border-left:1px solid var(--line);padding-left:30px}.insight h3{font-size:19px;font-weight:normal;margin:0 0 12px}.insight p{font-size:14px;color:var(--muted);margin:0 0 14px}.pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 8px;background:#edf4ef;color:var(--teal);display:inline-block;margin-bottom:12px}
